[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-rl-lab"
version = "0.1.0"
description = "Self-contained autonomous-parking environment with PPO, SAC, and discrete-to-continuous curricula."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
parking-rl = "parking_rl:main"

[tool.setuptools]
py-modules = ["parking_rl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

